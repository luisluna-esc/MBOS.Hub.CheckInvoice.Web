server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://inventrack-backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # index.html referencia los nombres de archivo con hash de cada build (ej. main.a1b2c3.js);
    # si el navegador la cachea, después de un deploy sigue pidiendo archivos viejos que ya no
    # existen y la app queda rota hasta que el usuario limpia caché a mano.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Los i18n/*.json no llevan hash de build (mismo nombre siempre) y el navegador los cachea
    # igual que cualquier estático: después de un deploy con textos nuevos, sigue mostrando las
    # traducciones viejas (o claves crudas tipo "nav.algo" si la clave es nueva) hasta que se
    # limpia la caché a mano. Mismo tratamiento que index.html.
    location /i18n/ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
