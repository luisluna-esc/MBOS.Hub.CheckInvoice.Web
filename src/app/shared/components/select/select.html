<div class="flex w-full flex-col gap-1">
  @if (label()) {
    <label [id]="selectId + '-label'" class="text-sm font-medium text-foreground">
      {{ label() }}
    </label>
  }

  <button
    #origin="cdkOverlayOrigin"
    #trigger
    cdkOverlayOrigin
    type="button"
    [id]="selectId"
    [disabled]="disabled()"
    [attr.aria-haspopup]="'listbox'"
    [attr.aria-expanded]="open()"
    [attr.aria-labelledby]="label() ? selectId + '-label' : null"
    [attr.aria-invalid]="showError"
    class="flex w-full items-center justify-between rounded-md border bg-surface px-3 py-2 text-left text-sm text-foreground transition-colors focus:outline-none focus:ring-2 focus:ring-primary disabled:cursor-not-allowed disabled:opacity-60"
    [class.border-border]="!showError"
    [class.border-danger]="showError"
    (click)="toggle()"
    (keydown)="onTriggerKeydown($event)"
  >
    <span class="min-w-0 truncate" [class.text-muted-foreground]="!selectedOption()">
      {{ (selectedOption()?.label ?? placeholder()) || ' ' }}
    </span>
    <svg
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      class="size-4 shrink-0 text-muted-foreground"
    >
      <path d="M6 9l6 6 6-6" />
    </svg>
  </button>

  <ng-template
    cdkConnectedOverlay
    [cdkConnectedOverlayOrigin]="origin"
    [cdkConnectedOverlayOpen]="open()"
    [cdkConnectedOverlayPositions]="overlayPositions"
    [cdkConnectedOverlayHasBackdrop]="true"
    cdkConnectedOverlayBackdropClass="cdk-overlay-transparent-backdrop"
    (backdropClick)="close()"
    (detach)="close()"
  >
    <div
      #panel
      class="min-w-[12rem] overflow-hidden rounded-md border border-border bg-surface shadow-lg"
      (keydown)="onPanelKeydown($event)"
    >
      @if (showSearch()) {
        <div class="border-b border-border p-1.5">
          <input
            type="text"
            [value]="searchQuery()"
            (input)="onSearchInput($event)"
            placeholder="Buscar..."
            autocomplete="off"
            class="w-full rounded border border-border bg-background px-2 py-1 text-sm text-foreground focus:outline-none focus:ring-2 focus:ring-primary"
          />
        </div>
      }
      <ul role="listbox" tabindex="-1" class="max-h-60 overflow-auto py-1 focus:outline-none">
        @for (option of filteredOptions(); track option.value; let i = $index) {
          <li
            role="option"
            [attr.data-index]="i"
            [attr.aria-selected]="option.value === value()"
            class="cursor-pointer px-3 py-2 text-sm transition-colors"
            [class.bg-primary]="option.value === value()"
            [class.text-primary-foreground]="option.value === value()"
            [class.text-foreground]="option.value !== value()"
            [class.hover:bg-brand-300]="option.value !== value()"
            [class.bg-brand-300]="i === activeIndex() && option.value !== value()"
            [class.underline]="i === activeIndex() && option.value === value()"
            (mouseenter)="activeIndex.set(i)"
            (click)="selectOption(option)"
          >
            {{ option.label }}
          </li>
        } @empty {
          <li class="px-3 py-2 text-sm text-muted-foreground">Sin resultados.</li>
        }
      </ul>
    </div>
  </ng-template>

  @if (showError) {
    <p class="min-h-4 text-xs text-danger">{{ errorMessage }}</p>
  } @else if (hint()) {
    <p class="min-h-4 text-xs text-muted-foreground">{{ hint() }}</p>
  } @else {
    <p class="min-h-4 text-xs" aria-hidden="true">&nbsp;</p>
  }
</div>
