<span
  class="block animate-pulse"
  [class.bg-surface]="tone() === 'surface'"
  [class.bg-border/50]="tone() === 'muted'"
  [class.rounded-sm]="rounded() === 'sm'"
  [class.rounded-md]="rounded() === 'md'"
  [class.rounded-lg]="rounded() === 'lg'"
  [class.rounded-full]="rounded() === 'full'"
  [style.width]="width()"
  [style.height]="height()"
></span>
