<div class="pointer-events-none fixed bottom-4 right-4 z-50 flex w-80 flex-col-reverse gap-2">
  @for (toast of toastService.toasts(); track toast.id) {
    <div
      class="pointer-events-auto flex items-start gap-3 rounded-lg border border-border bg-surface p-3 shadow-lg"
      role="status"
    >
      <div class="min-w-0 flex-1">
        <p class="text-sm font-semibold text-foreground">{{ toast.message }}</p>
        @if (toast.description) {
          <p class="mt-0.5 text-xs text-muted-foreground">{{ toast.description }}</p>
        }
      </div>
      <button
        type="button"
        class="shrink-0 rounded text-muted-foreground transition-colors hover:text-foreground"
        aria-label="Cerrar notificación"
        (click)="toastService.dismiss(toast.id)"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          class="size-4"
        >
          <path d="M6 6l12 12M18 6L6 18" />
        </svg>
      </button>
    </div>
  }
</div>
