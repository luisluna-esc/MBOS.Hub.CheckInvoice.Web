<button
  #origin="cdkOverlayOrigin"
  cdkOverlayOrigin
  type="button"
  [attr.aria-label]="label()"
  [attr.aria-expanded]="open()"
  class="inline-flex size-5 shrink-0 items-center justify-center rounded-full border border-border text-muted-foreground transition-colors hover:border-primary hover:text-primary focus:outline-none focus:ring-2 focus:ring-primary"
  (click)="toggle()"
>
  <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="size-3.5">
    <path d="M12 11.5V16.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
    <circle cx="12" cy="8" r="1" fill="currentColor" />
    <path
      d="M7 3.33782C8.47087 2.48697 10.1786 2 12 2C17.5228 2 22 6.47715 22 12C22 17.5228 17.5228 22 12 22C6.47715 22 2 17.5228 2 12C2 10.1786 2.48697 8.47087 3.33782 7"
      stroke="currentColor"
      stroke-width="1.5"
      stroke-linecap="round"
    />
  </svg>
</button>

<ng-template
  cdkConnectedOverlay
  [cdkConnectedOverlayOrigin]="origin"
  [cdkConnectedOverlayOpen]="open()"
  [cdkConnectedOverlayPositions]="overlayPositions"
  [cdkConnectedOverlayHasBackdrop]="true"
  cdkConnectedOverlayBackdropClass="cdk-overlay-transparent-backdrop"
  (backdropClick)="close()"
  (detach)="close()"
>
  <div class="w-80 max-w-[85vw] rounded-md border border-border bg-surface p-3 text-left shadow-lg">
    @if (title()) {
      <p class="mb-1 text-sm font-semibold text-foreground">{{ title() }}</p>
    }
    <div class="text-xs leading-relaxed whitespace-pre-line text-muted-foreground">
      <ng-content />
    </div>
  </div>
</ng-template>
