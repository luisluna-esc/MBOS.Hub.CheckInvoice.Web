<div
  class="inset-0 z-50 flex flex-col items-center justify-center gap-4 bg-background/50 backdrop-blur-sm"
  [class.fixed]="fixed()"
  [class.absolute]="!fixed()"
>
  <ng-content>
    <svg
      viewBox="0 0 48 48"
      fill="none"
      xmlns="http://www.w3.org/2000/svg"
      class="size-16 animate-pulse text-primary"
      stroke="currentColor"
      stroke-width="1.75"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path d="M7 19L3 10H14L16 19" />
      <path d="M31 19L33 10H43L39 19" />
      <path d="M7 19H31V39H7V19Z" />
      <path d="M7 29H31" />
      <path d="M19 19V39" />
      <circle cx="35" cy="15" r="6.5" />
      <path d="M39.6 19.6L44 24" />
    </svg>
  </ng-content>

  <div class="relative size-9 animate-spin">
    @for (dot of dots; track $index) {
      <span class="absolute left-1/2 top-1/2 size-1.5 rounded-full bg-primary" [style]="dot"></span>
    }
  </div>

  <p class="text-sm font-medium text-foreground">{{ label() ?? ('common.loading' | translate) }}</p>
</div>
