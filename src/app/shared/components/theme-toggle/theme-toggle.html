<button
  type="button"
  class="inline-flex items-center justify-center rounded-full border border-border bg-surface p-2 text-foreground transition-colors hover:opacity-80"
  [attr.aria-label]="themeService.theme() === 'dark' ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'"
  (click)="themeService.toggle()"
>
  @if (themeService.theme() === 'dark') {
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="size-5">
      <path
        d="M21.64 13a1 1 0 0 0-1.05-.14 8.05 8.05 0 0 1-3.37.73 8.15 8.15 0 0 1-8.14-8.14c0-1.22.27-2.35.73-3.37a1 1 0 0 0-1.24-1.36A10.15 10.15 0 1 0 22 14.05a1 1 0 0 0-.36-1.05Z"
      />
    </svg>
  } @else {
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="size-5">
      <path
        d="M12 3a1 1 0 0 1 1 1v1a1 1 0 1 1-2 0V4a1 1 0 0 1 1-1Zm0 15a1 1 0 0 1 1 1v1a1 1 0 1 1-2 0v-1a1 1 0 0 1 1-1Zm9-6a1 1 0 0 1-1 1h-1a1 1 0 1 1 0-2h1a1 1 0 0 1 1 1ZM5 12a1 1 0 0 1-1 1H3a1 1 0 1 1 0-2h1a1 1 0 0 1 1 1Zm12.72 6.72a1 1 0 0 1-1.41 0l-.71-.71a1 1 0 0 1 1.41-1.41l.71.71a1 1 0 0 1 0 1.41ZM7.4 6.4a1 1 0 0 1-1.41 0l-.71-.71A1 1 0 0 1 6.69 4.28l.71.71a1 1 0 0 1 0 1.41Zm11.31-1.41a1 1 0 0 1 0 1.41l-.71.71A1 1 0 1 1 16.6 5.7l.71-.71a1 1 0 0 1 1.41 0ZM6.69 19.72a1 1 0 0 1-1.41 0 1 1 0 0 1 0-1.41l.71-.71A1 1 0 1 1 7.4 19l-.71.71ZM12 7a5 5 0 1 1 0 10 5 5 0 0 1 0-10Z"
      />
    </svg>
  }
</button>
