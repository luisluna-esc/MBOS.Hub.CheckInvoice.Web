<div [class]="containerClass()">
  <div class="flex items-center gap-3 border-b border-border px-4 py-3">
    @if (title()) {
      <h2 class="text-base font-semibold text-foreground">{{ title() }}</h2>
    }
    <button
      type="button"
      class="ml-auto rounded text-muted-foreground transition-colors hover:text-foreground"
      [attr.aria-label]="'dialog.close' | translate"
      (click)="cancel.emit()"
    >
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="size-6">
        <path
          d="M14.5 9.50002L9.5 14.5M9.49998 9.5L14.5 14.5"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
        />
        <path
          d="M7 3.33782C8.47087 2.48697 10.1786 2 12 2C17.5228 2 22 6.47715 22 12C22 17.5228 17.5228 22 12 22C6.47715 22 2 17.5228 2 12C2 10.1786 2.48697 8.47087 3.33782 7"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
        />
      </svg>
    </button>
  </div>

  <div class="flex-1 overflow-auto bg-background px-4 py-4">
    <ng-content />
  </div>

  <div class="flex justify-end gap-2 border-t border-border px-4 py-3">
    @if (showCancel()) {
      <button
        type="button"
        class="rounded-md border border-border px-4 py-2 text-sm text-foreground transition-colors hover:bg-brand-300/20"
        (click)="cancel.emit()"
      >
        {{ cancelLabel() ?? ('dialog.cancel' | translate) }}
      </button>
    }
    <button
      type="button"
      class="rounded-md bg-primary px-4 py-2 text-sm text-primary-foreground transition-colors disabled:cursor-not-allowed disabled:opacity-50"
      [disabled]="saveDisabled()"
      (click)="save.emit()"
    >
      {{ saveLabel() ?? ('dialog.save' | translate) }}
    </button>
  </div>
</div>
