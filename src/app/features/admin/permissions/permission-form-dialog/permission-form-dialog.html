<app-dialog
  [title]="(isEdit ? 'permissions.form.editTitle' : 'permissions.form.newTitle') | translate"
  [saveDisabled]="saveDisabled()"
  (save)="onSave()"
  (cancel)="onCancel()"
>
  <form [formGroup]="form" class="flex flex-col gap-4">
    <app-input formControlName="code" [label]="'permissions.form.code' | translate" [required]="true" [maxLength]="100" />
    <app-input formControlName="name" [label]="'permissions.form.name' | translate" [required]="true" [maxLength]="100" />
    <app-input formControlName="module" [label]="'permissions.form.module' | translate" [required]="true" [maxLength]="50" />
    <app-input formControlName="description" [label]="'permissions.form.description' | translate" [maxLength]="255" />
    <app-checkbox formControlName="isActive">{{ 'permissions.form.isActive' | translate }}</app-checkbox>
  </form>
</app-dialog>
