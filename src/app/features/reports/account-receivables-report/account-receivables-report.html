<div class="flex flex-col gap-6">
  <h1 class="text-xl font-semibold text-foreground">{{ 'reports.accountReceivables.title' | translate }}</h1>

  <div class="flex flex-col gap-3 rounded-md border border-border bg-surface p-3">
    <p class="text-xs text-muted-foreground">{{ 'reports.accountReceivables.description' | translate }}</p>

    <div class="grid grid-cols-1 gap-3 sm:grid-cols-4">
      <app-select
        [label]="'reports.accountReceivables.client' | translate"
        [placeholder]="'reports.accountReceivables.allClients' | translate"
        [options]="clients()"
        [ngModel]="clientId()"
        (ngModelChange)="clientId.set($event)"
      />
      <app-select
        [label]="'reports.accountReceivables.status' | translate"
        [placeholder]="'reports.accountReceivables.allStatuses' | translate"
        [options]="statusOptions()"
        [ngModel]="status()"
        (ngModelChange)="status.set($event)"
      />
      <app-date-picker
        [label]="'reports.accountReceivables.dateFrom' | translate"
        [ngModel]="dateFrom()"
        (ngModelChange)="dateFrom.set($event)"
      />
      <app-date-picker
        [label]="'reports.accountReceivables.dateTo' | translate"
        [ngModel]="dateTo()"
        (ngModelChange)="dateTo.set($event)"
      />
    </div>
  </div>

  @if (loading()) {
    <div class="flex flex-col gap-2 rounded-md border border-border p-4">
      @for (i of [1, 2, 3, 4, 5]; track i) {
        <app-skeleton height="1.25rem" width="100%" />
      }
    </div>
  } @else if (previewUrl(); as url) {
    <iframe [src]="url" class="w-full rounded-md border border-border" style="height: 80vh"></iframe>
  }
</div>
