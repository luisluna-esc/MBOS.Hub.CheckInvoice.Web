<div class="flex flex-col gap-6">
  <div class="flex items-center gap-1.5">
    <h1 class="text-xl font-semibold text-foreground">{{ 'reports.pastorField.title' | translate }}</h1>
    <app-tooltip [text]="'reports.pastorField.hint' | translate" position="right">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="size-4 text-muted-foreground">
        <path d="M12 17V11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
        <circle cx="1" cy="1" r="1" transform="matrix(1 0 0 -1 11 9)" fill="currentColor" />
        <path
          d="M7 3.33782C8.47087 2.48697 10.1786 2 12 2C17.5228 2 22 6.47715 22 12C22 17.5228 17.5228 22 12 22C6.47715 22 2 17.5228 2 12C2 10.1786 2.48697 8.47087 3.33782 7"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
        />
      </svg>
    </app-tooltip>
  </div>

  <div class="flex flex-col gap-3 rounded-md border border-border bg-surface p-3">
    <p class="text-xs text-muted-foreground">{{ 'reports.pastorField.description' | translate }}</p>

    <div class="grid grid-cols-1 gap-3 sm:grid-cols-3">
      <app-select
        [label]="'reports.pastorField.client' | translate"
        [options]="clients()"
        [ngModel]="clientId()"
        (ngModelChange)="clientId.set($event)"
      />
      <app-date-picker
        [label]="'reports.pastorField.dateFrom' | translate"
        [ngModel]="dateFrom()"
        (ngModelChange)="dateFrom.set($event)"
      />
      <app-date-picker
        [label]="'reports.pastorField.dateTo' | translate"
        [ngModel]="dateTo()"
        (ngModelChange)="dateTo.set($event)"
      />
    </div>
  </div>

  @if (loading()) {
    <div class="flex flex-col gap-2 rounded-md border border-border p-4">
      @for (i of [1, 2, 3, 4, 5]; track i) {
        <app-skeleton height="1.25rem" width="100%" />
      }
    </div>
  } @else if (previewUrl(); as url) {
    <iframe [src]="url" class="w-full rounded-md border border-border" style="height: 80vh"></iframe>
  } @else {
    <p class="text-sm text-muted-foreground">{{ 'reports.pastorField.selectPrompt' | translate }}</p>
  }
</div>
