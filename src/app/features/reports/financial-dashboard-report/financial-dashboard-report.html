<div class="flex flex-col gap-3 rounded-md border border-border bg-surface p-3">
  <p class="text-xs text-muted-foreground">{{ 'reports.financialDashboard.description' | translate }}</p>

  <button
    type="button"
    class="w-fit rounded-md bg-primary px-4 py-2 text-sm font-medium text-primary-foreground transition-colors hover:bg-primary/90 disabled:cursor-not-allowed disabled:opacity-60"
    [disabled]="downloading()"
    (click)="onDownload()"
  >
    {{ (downloading() ? 'reports.financialDashboard.downloading' : 'reports.financialDashboard.download') | translate }}
  </button>
</div>
