<app-dialog
  [title]="(isEdit ? 'churches.form.editTitle' : 'churches.form.newTitle') | translate"
  [saveDisabled]="saveDisabled()"
  (save)="onSave()"
  (cancel)="onCancel()"
>
  <form [formGroup]="form" class="flex flex-col gap-4">
    <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
      <app-input formControlName="code" [label]="'churches.form.code' | translate" [maxLength]="20" />
      <app-input formControlName="churchName" [label]="'churches.form.name' | translate" [required]="true" [maxLength]="150" />
      <app-select
        formControlName="districtId"
        [label]="'churches.form.district' | translate"
        [options]="districtOptions()"
      />
      <app-select
        formControlName="churchTypeId"
        [label]="'churches.form.type' | translate"
        [options]="churchTypeOptions()"
      />
    </div>

    <app-checkbox formControlName="isActive">{{ 'churches.form.isActive' | translate }}</app-checkbox>
  </form>
</app-dialog>
