<div class="flex flex-col gap-4">
  <div class="flex items-center gap-3">
    <button
      type="button"
      class="flex size-8 items-center justify-center rounded-md text-muted-foreground transition-colors hover:bg-surface hover:text-foreground"
      [attr.aria-label]="'dialog.cancel' | translate"
      (click)="onBack()"
    >
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="size-5">
        <path d="M15 6L9 12L15 18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </button>
    <h1 class="text-xl font-semibold text-foreground">{{ 'clients.portalAccess.pendingTitle' | translate }}</h1>
  </div>

  <p class="text-sm text-muted-foreground">{{ 'clients.portalAccess.pendingDescription' | translate }}</p>

  @if (errorCode()) {
    <div class="rounded-lg border border-border">
      <app-error-state [code]="errorCode()!" />
    </div>
  } @else {
    <app-table
      [columns]="columns()"
      [rows]="rows()"
      [actions]="actions()"
      [totalRecords]="totalRecords()"
      [pageNumber]="pageNumber()"
      [pageSize]="pageSize()"
      [emptyMessage]="'clients.portalAccess.pendingEmpty' | translate"
      [loading]="loading()"
      (pageChange)="onPageChange($event)"
      (pageSizeChange)="onPageSizeChange($event)"
    />
  }
</div>
