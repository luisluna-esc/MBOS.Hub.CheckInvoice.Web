<div class="flex flex-col gap-4">
  <div class="flex items-center justify-between">
    <h1 class="text-xl font-semibold text-foreground">{{ 'pastors.title' | translate }}</h1>
  </div>

  <p class="text-sm text-muted-foreground">{{ 'pastors.description' | translate }}</p>

  <app-filters [fields]="filterFields()" (search)="onSearch($event)" (clear)="onClear()" />

  @if (errorCode()) {
    <div class="rounded-lg border border-border">
      <app-error-state [code]="errorCode()!" />
    </div>
  } @else {
    <app-table
      [columns]="columns()"
      [rows]="rows()"
      [actions]="actions()"
      [totalRecords]="totalRecords()"
      [pageNumber]="pageNumber()"
      [pageSize]="pageSize()"
      [emptyMessage]="'pastors.empty' | translate"
      [loading]="loading()"
      (pageChange)="onPageChange($event)"
      (pageSizeChange)="onPageSizeChange($event)"
    />
  }
</div>
