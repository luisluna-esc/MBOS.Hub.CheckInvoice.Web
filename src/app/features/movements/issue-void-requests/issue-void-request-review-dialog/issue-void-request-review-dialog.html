<app-dialog
  [title]="(isReject ? 'issueVoidRequests.review.rejectTitle' : 'issueVoidRequests.review.approveTitle') | translate"
  [saveDisabled]="saveDisabled()"
  (save)="onSave()"
  (cancel)="onCancel()"
>
  <form [formGroup]="form" class="flex flex-col gap-4">
    <p class="text-sm text-foreground">
      {{ (isReject ? 'issueVoidRequests.review.rejectHint' : 'issueVoidRequests.review.approveHint') | translate }}
    </p>
    <app-input
      formControlName="reviewNotes"
      [label]="(isReject ? 'issueVoidRequests.review.notesRequired' : 'issueVoidRequests.review.notesOptional') | translate"
      [required]="isReject"
      [maxLength]="255"
    />
  </form>
</app-dialog>
