<app-dialog
  [title]="'issueVoidRequests.dialog.title' | translate"
  [saveDisabled]="saveDisabled()"
  (save)="onSave()"
  (cancel)="onCancel()"
>
  <form [formGroup]="form" class="flex flex-col gap-4">
    <app-select
      formControlName="voidReasonId"
      [label]="'issueVoidRequests.dialog.reason' | translate"
      [options]="voidReasonOptions()"
      [required]="true"
    />
    <app-input
      formControlName="detail"
      [label]="'issueVoidRequests.dialog.detail' | translate"
      [maxLength]="255"
    />
  </form>
</app-dialog>
